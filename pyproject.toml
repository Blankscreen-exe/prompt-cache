[project]
name = "prompt-cache"
version = "0.1.0"
description = "Write, find and fill reusable AI prompts in seconds, from the terminal."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Blankscreen-exe" }]
keywords = ["prompts", "templates", "tui", "textual", "clipboard"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
]
dependencies = ["textual>=8.0,<9"]

[project.scripts]
prompt-cache = "prompt_cache.__main__:main"

[project.urls]
Repository = "https://github.com/Blankscreen-exe/prompt-cache"

[tool.uv]
# Use the OS certificate store. Some security software intercepts HTTPS and presents its own
# root certificate, which uv does not trust by default; this fixes that without weakening
# verification. See docs/08-working-with-the-user.md.
native-tls = true

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_cache"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
